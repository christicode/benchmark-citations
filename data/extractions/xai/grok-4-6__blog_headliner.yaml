# grok-4-6__blog_headliner
# Source: https://x.ai/news/grok-4-6 (xAI, 2026-08-12)
# The "Evals" section is ONE comparison table (columns: Grok 4.6 High | Grok 4.5 High |
# GPT-5.6 Sol Max | Fable 5 Max) => model_card (doc default). Five of the ten benchmarks also
# appear as a headline bar-chart widget at the top (AA Intelligence, GDPVal-AA, DeepSWE 1.1,
# CursorBench 3.2, FrontierCode 1.1) => weight_class: blog_headliner override (weight = MAX per doc).
# Citing model = Grok 4.6 (High effort). "Best score per evaluation in bold. Third-party model
# scores are the best of self-reported or publicly available results."
# NB Terminal-Bench v3.0 (26%) is the NEW harder version (distinct canonical from TB 2.1); Grok 4.6
# does NOT report TB 2.1. No separate xAI model-card PDF exists for 4.6 (data.x.ai 404; blog only).
doc: grok-4-6__blog_headliner
