# gpt-6-astra__blog_headliner
# Source: https://openai.com/index/gpt-6-astra/ (OpenAI launch blog, 2026-09-03). Read as primary
# text via web_fetch. Carries ONE big comparison table (columns: GPT-6 Astra | GPT-5.6 Sol |
# Claude Fable 5.1 | Claude Fable 5 | Claude Opus 5 | Gemini 3.8 Flash) => model_card (doc default);
# benchmarks with a dedicated per-capability chart/callout in the post override to blog_headliner.
# Citing model = GPT-6 Astra (first column). Competitor values recorded in methodology for context.
# "Evaluation scores are the maximum at any effort." Internal lower-is-better ALIGNMENT safety rows
# (computer-use safety, circumvention, honeypot, hallucination) are NOT recorded, per OpenAI convention.
