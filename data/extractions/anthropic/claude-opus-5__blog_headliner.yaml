# claude-opus-5__blog_headliner
# Source: https://www.anthropic.com/news/claude-opus-5 (Anthropic, 2026-07-24)
# The blog carries a model-card comparison TABLE (image, READ by vision: Opus 5 vs Fable 5 /
# Opus 4.8 / GPT-5.6 Sol) => model_card (doc default). Benchmarks that ALSO have their own
# solo effort/per-domain chart in the post are marked weight_class: blog_headliner (higher class;
# weight is MAX per doc). CursorBench / AA Coding Agent Index / DeepSearchQA are solo charts with
# no single legible number => score_pending. BrowseComp is table-only (absent from blog prose).
doc: claude-opus-5__blog_headliner
mentions:
