# claude-fable-5-1__blog_headliner
# Source: https://www.anthropic.com/claude-fable-and-mythos-5-1 (Anthropic launch blog, 2026-09-01).
# The comparison-table chart data is embedded as CSV in the page (columns: Claude Fable 5.1 |
# Claude Fable 5 | Claude Opus 5 | GPT-5.6 Sol) => model_card (doc default). The two NEW headline
# benchmarks with dedicated cost-vs-score charts (Terminal-Bench-Science 0.1, Terminal-Bench 4.0) and
# the SOTA CursorBench + HLE-with-tools callouts override to blog_headliner. Citing model = Claude
# Fable 5.1 (safeguards ON); Mythos 5.1 = same weights, safeguards off (recorded in model_config).
# CONFIG-DEPENDENT: with safeguards on, cyber requests fall back to Opus 4.8 and biology to Opus 5;
# on tasks where safeguards fired, Fable 5.1/Fable 5 scored 0 on OSWorld 2.0 (footnotes on the page).
doc: claude-fable-5-1__blog_headliner
mentions:
  - raw: "Terminal-Bench-Science 0.1"
    weight_class: blog_headliner
    value: 52.6
    unit: percent
    model_config: "Claude Fable 5.1 (safeguards on); Claude Code, --bare mode"
    methodology:
      - "Fable 5 24.7 / Opus 5 29.0 / GPT-5.6 Sol 22.4; standard error +/-3.5-4.5 pts"
      - "public leaderboard (3 trials, Claude Code): Opus 5 30.0 / Fable 5 21.4; Anthropic reproduced 29.0 / 24.7"
